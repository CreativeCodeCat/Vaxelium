[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
common = { path = "../common" }
iced = { version = "0.14", features = ["svg", "image", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
pulldown-cmark = "0.13"
unicode-segmentation = "1"
# Instant and SystemTime that also work in the browser.
web-time = "1"

# The desktop: TLS sockets on threads, the system keychain, files and the tray.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", features = ["tokio"] }
keyring = "4.2.0"
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# The browser: WebSockets, browser storage and fetching artwork from the server.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "Window", "Location", "Storage", "Response", "Request", "Document", "HtmlElement"] }
console_error_panic_hook = "0.1"
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
iced_test = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
