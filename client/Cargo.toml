[package]
name = "client"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
common = { path = "../common" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = "2.12"
tauri-plugin-dialog = "2"
